name: Android Host E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: android-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-login:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'android-host-e2e')
    name: Android E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install MCP
        run: npm ci
      - name: Build MCP
        run: npm run build
      - name: Prepare SDK, isolated AVD and source-built fixture
        run: node scripts/prepare-ci-android.mjs
      - name: Enable Linux KVM
        if: runner.os == 'Linux'
        run: sudo chmod a+rw /dev/kvm
      - name: Prepare isolated Appium
        shell: bash
        run: |
          npm install --prefix .mobiloop/appium --ignore-scripts --no-audit --fund=false appium@3.6.0
          node .mobiloop/appium/node_modules/appium/index.js driver install uiautomator2@7.2.2
      - name: Execute three UI scenarios and negative control
        run: node scripts/run-hosted-android.mjs
      - name: Upload fixture-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-host-${{ matrix.os }}
          path: |
            .mobiloop/runs
            .mobiloop/build
            .mobiloop/hosted-android
          if-no-files-found: warn
