# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        timeout-minutes: 3
        env:
          MOBILOOP_TEST_TRACE: "1"
        run: npm test

      - name: Static documentation site check
        run: npm run site:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Package dry run
        run: npm run pack:check

      - name: Clean package install and first-use smoke
        run: npm run test:install

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Docker build
        run: docker build -t mobiloop-mcp:ci .

  validate:
    name: Validate
    if: always()
    needs: [package, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: test "$PACKAGE_RESULT" = success && test "$DOCKER_RESULT" = success
